<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280" />
<title>UiBot 认证考生</title>
<link rel="stylesheet" href="assets/style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231890ff'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Arial' fill='%23fff' text-anchor='middle'%3EU%3C/text%3E%3C/svg%3E" />
</head>
<body class="app-body">

<div class="shell">

  <!-- 左侧菜单 -->
  <aside class="side">
    <nav class="menu" id="menu">
      <a class="menu-item" data-view="stock">库存</a>
      <a class="menu-item" data-view="orders">订单</a>
      <a class="menu-item" data-view="customers">客户</a>
    </nav>
  </aside>

  <!-- 主区 -->
  <main class="main">

    <div class="page-head">
      <div class="acct-line">当前帐号：<b id="account">UiBot</b></div>
      <div class="head-row">
        <div class="filters" id="filters"></div>
        <div class="head-actions">
          <div class="exp-group" id="expGroup">
            <button class="btn btn-primary" id="btnExportSel" disabled>导出选中项</button>
            <button class="btn btn-primary btn-caret" id="btnExportMenu" disabled
                    title="选择导出格式" aria-haspopup="true" aria-expanded="false">
              <svg viewBox="0 0 10 6" fill="none" aria-hidden="true">
                <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.4"
                      stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
            <div class="exp-menu" id="expMenu" hidden>
              <button class="exp-item" type="button" data-ext="xlsx">Excel 工作簿 (*.xlsx)</button>
              <button class="exp-item" type="button" data-ext="csv">CSV 文本 (*.csv)</button>
            </div>
          </div>
          <button class="btn btn-plain" id="btnLogout">退出</button>
        </div>
      </div>
    </div>

    <section class="content">
      <div class="table-card">
        <table class="grid">
          <colgroup id="colgroup"></colgroup>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="empty" style="display:none">没有符合条件的数据</div>
      </div>

      <div class="table-foot">
        <span class="status" id="statusText">加载完成</span>
        <div class="pager" id="pager"></div>
        <span class="page-info" id="pageInfo"></span>
      </div>
    </section>

    <footer class="copyright">
      Copyright © 2026 来也科技（北京）有限公司 UiBot —— 中国 RPA 的先驱，机器人流程自动化专家
    </footer>
  </main>
</div>

<!-- 日期选择浮层 -->
<div class="dp" id="dpPop" style="display:none"></div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="assets/data.js"></script>
<script src="assets/xlsx.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
